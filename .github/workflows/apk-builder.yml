name: Build WebView APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate APK from HTML
        uses: kimhuilim/html-to-apk-action@alpha3
        with:
          build-folder-path: '.'
          app-name: 'GameBoy Launcher'
          output-folder-path: 'apk/'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameboy-launcher-apk
          path: apk/*.apk
